# Universal F1TENTH Controller Visualizer Configuration
# This configuration file supports multiple controller types with flexible topic mapping

# Controller type to visualize
# Supported: lqr, lqg, mpc, pid, pure_pursuit, stanley, custom
controller_type: "lqr"

# Maximum number of data points to keep in history
max_history: 1000

# GUI update rate in Hz
update_rate_hz: 10

# ROS2 topic mappings - customize for your specific controller
topics:
  # Core topics (required)
  control_output: "/drive" # AckermannDriveStamped
  odometry: "/odom" # Odometry

  # Optional topics (will be subscribed if available)
  trajectory: "/reference_trajectory" # VehicleStateArray or custom trajectory msg
  diagnostics: "/diagnostics" # DiagnosticArray
  state_error: "/state_error" # Float32
  path_ready: "/path_ready" # Bool
  emergency_stop: "/emergency_stop" # Bool
  controller_status: "/controller_status" # String

# Visualization settings
visualization:
  show_trajectory: true # Show vehicle path and reference trajectory
  show_control_history: true # Show control input history plots
  show_performance: true # Show performance metrics and state error
  show_diagnostics: true # Show detailed diagnostics text

# Plot appearance settings
plots:
  trajectory:
    vehicle_color: "red"
    reference_color: "blue"
    vehicle_size: 8
    arrow_length: 0.5

  control:
    acceleration_color: "blue"
    steering_color: "red"
    actual_color: "green"

  performance:
    error_color: "green"
    velocity_color: "magenta"
    reference_alpha: 0.7

# Data export settings
export:
  default_format: "json" # json, csv
  include_config: true
  timestamp_format: "%Y%m%d_%H%M%S"

# Controller-specific configurations
controller_configs:
  lqr:
    topics:
      # LQR-specific topic overrides
      state_error: "/lqr/state_error"
      diagnostics: "/lqr/diagnostics"

  lqg:
    topics:
      # LQG-specific topic overrides
      state_error: "/lqg/state_error"
      diagnostics: "/lqg/diagnostics"
      estimation_error: "/lqg/estimation_error"

  mpc:
    topics:
      # MPC-specific topic overrides
      predicted_trajectory: "/mpc/predicted_trajectory"
      optimization_time: "/mpc/optimization_time"
      diagnostics: "/mpc/diagnostics"
